  totalPrice: Float
  status: String
  specialRequests: String
}

input CreateExperienceBookingInput {
  userId: Int!
  experienceId: String!
  date: DateTime!
  participants: Int!
  totalPrice: Float!
}

input UpdateExperienceBookingInput {
