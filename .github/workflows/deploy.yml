name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: "https://iamspring.github.io/MarriottHotels/api"
          VITE_AUTH_DOMAIN: "iamspring.github.io"
          VITE_PROJECT_ID: "marriott-hotels"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_ASSISTANT_ID: ${{ secrets.AI_ASSISTANT_ID }}
          AI_ADMIN_ID: ${{ secrets.AI_ADMIN_ID }}
          ENABLE_AI_CHAT: "true"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist 